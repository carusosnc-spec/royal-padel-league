name: Install RPL pair statistics
on:
  push:
    branches:
      - main
    paths:
      - 'pair-stats.js'
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add pair statistics and update version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          tag = '<script src="./pair-stats.js?v=1"></script>'
          if tag not in s:
              marker = "</body>"
              if marker not in s:
                  raise SystemExit("Tag </body> non trovato: nessuna modifica eseguita")
              s = s.replace(marker, tag + "\n" + marker, 1)
          s = s.replace("9.1.13", "9.1.14")
          p.write_text(s, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add RPL pair statistics to player profiles"
            git push origin HEAD:main
          fi